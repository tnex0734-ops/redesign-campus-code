<svg viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sarvam-inspired continuous blue-to-orange spectrum gradient -->
    <linearGradient id="spectrumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="20%" stop-color="#2563EB" />
      <stop offset="42%" stop-color="#4A8FE7" />
      <stop offset="62%" stop-color="#E0AA85" />
      <stop offset="82%" stop-color="#EE7C38" />
      <stop offset="100%" stop-color="#C84B1A" />
    </linearGradient>

    <!-- Subtle faded spectrum for background geometry -->
    <linearGradient id="spectrumFaded" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" stop-opacity="0.35" />
      <stop offset="22%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="44%" stop-color="#4A8FE7" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#E0AA85" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#EE7C38" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C84B1A" stop-opacity="0.35" />
    </linearGradient>

    <!-- Glow Filter for central portal nexus -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g class="mandala-assembly" transform="translate(500, 500)">
    <!-- 1. Outer Concentric Boundary Rings -->
    <circle r="460" stroke="#EAEAEF" stroke-width="1" />
    <circle r="430" stroke="url(#spectrumFaded)" stroke-width="1.2" stroke-dasharray="4 8" />
    <circle r="390" stroke="#E2E2E8" stroke-width="1" />

    <!-- 2. Radial Ray Lines at 15-degree intervals (Outer Corona) -->
    <g stroke="#E8E8EE" stroke-width="1">
      <line x1="0" y1="-430" x2="0" y2="-460" />
      <line x1="111.3" y1="-415.3" x2="119.1" y2="-444.3" />
      <line x1="215" y1="-372.4" x2="230" y2="-398.4" />
      <line x1="304.1" y1="-304.1" x2="325.3" y2="-325.3" />
      <line x1="372.4" y1="-215" x2="398.4" y2="-230" />
      <line x1="415.3" y1="-111.3" x2="444.3" y2="-119.1" />
      <line x1="430" y1="0" x2="460" y2="0" />
      <line x1="415.3" y1="111.3" x2="444.3" y2="119.1" />
      <line x1="372.4" y1="215" x2="398.4" y2="230" />
      <line x1="304.1" y1="304.1" x2="325.3" y2="325.3" />
      <line x1="215" y1="372.4" x2="230" y2="398.4" />
      <line x1="111.3" y1="415.3" x2="119.1" y2="444.3" />
      <line x1="0" y1="430" x2="0" y2="460" />
      <line x1="-111.3" y1="415.3" x2="-119.1" y2="444.3" />
      <line x1="-215" y1="372.4" x2="-230" y2="398.4" />
      <line x1="-304.1" y1="304.1" x2="-325.3" y2="325.3" />
      <line x1="-372.4" y1="215" x2="-398.4" y2="230" />
      <line x1="-415.3" y1="111.3" x2="-444.3" y2="119.1" />
      <line x1="-430" y1="0" x2="-460" y2="0" />
      <line x1="-415.3" y1="-111.3" x2="-444.3" y2="-119.1" />
      <line x1="-372.4" y1="-215" x2="-398.4" y2="-230" />
      <line x1="-304.1" y1="-304.1" x2="-325.3" y2="-325.3" />
      <line x1="-215" y1="-372.4" x2="-230" y2="-398.4" />
      <line x1="-111.3" y1="-415.3" x2="-119.1" y2="-444.3" />
    </g>

    <!-- 3. Interlocking 8-Fold Orbital Mandala Circles (Sarvam-inspired geometric construction) -->
    <g stroke="url(#spectrumGradient)" stroke-width="1.5" opacity="0.8">
      <circle cx="0" cy="-180" r="180" />
      <circle cx="127.3" cy="-127.3" r="180" />
      <circle cx="180" cy="0" r="180" />
      <circle cx="127.3" cy="127.3" r="180" />
      <circle cx="0" cy="180" r="180" />
      <circle cx="-127.3" cy="127.3" r="180" />
      <circle cx="-180" cy="0" r="180" />
      <circle cx="-127.3" cy="-127.3" r="180" />
    </g>

    <!-- 4. Concentric Gateway Rings -->
    <circle r="330" stroke="url(#spectrumGradient)" stroke-width="2" />
    <circle r="260" stroke="#ECECF0" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle r="200" stroke="url(#spectrumGradient)" stroke-width="2.5" />
    <circle r="140" stroke="#DFDFE6" stroke-width="1" />
    <circle r="85" stroke="url(#spectrumGradient)" stroke-width="2" />

    <!-- 5. Central Gateway Arch / Aperture (CampusCode Arena Nexus) -->
    <g class="mandala-nexus">
      <circle r="42" fill="#FFFFFF" stroke="url(#spectrumGradient)" stroke-width="2.5" filter="url(#softGlow)" />
      <!-- Concentric Aperture Rings -->
      <circle r="28" stroke="#1B365D" stroke-width="1.5" />
      <circle r="16" fill="url(#spectrumGradient)" />
      <circle r="6" fill="#FFFFFF" />
    </g>

    <!-- 6. Quadrant Registration Crosshairs (+) -->
    <g stroke="#8A8A99" stroke-width="1.2">
      <!-- Top -->
      <line x1="0" y1="-475" x2="0" y2="-495" />
      <line x1="-10" y1="-485" x2="10" y2="-485" />
      <!-- Bottom -->
      <line x1="0" y1="475" x2="0" y2="495" />
      <line x1="-10" y1="485" x2="10" y2="485" />
      <!-- Left -->
      <line x1="-475" y1="0" x2="-495" y2="0" />
      <line x1="-485" y1="-10" x2="-485" y2="10" />
      <!-- Right -->
      <line x1="475" y1="0" x2="495" y2="0" />
      <line x1="485" y1="-10" x2="485" y2="10" />
    </g>

    <!-- 7. Mathematical Degree Tick Marks & Labels -->
    <g font-family="IBM Plex Mono, monospace" font-size="9" fill="#888896" letter-spacing="0.5">
      <text x="0" y="-405" text-anchor="middle">000° · DISCOVER</text>
      <text x="405" y="4" text-anchor="start">090° · TEAM UP</text>
      <text x="0" y="415" text-anchor="middle">180° · BUILD</text>
      <text x="-405" y="4" text-anchor="end">270° · SHIP</text>
    </g>
  </g>
</svg>

